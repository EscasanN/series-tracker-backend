openapi: 3.0.0
info:
  title: Series Tracking API
  description: API para seguimiento y gestión de series de TV
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Servidor de desarrollo local

components:
  schemas:
    Series:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: ID único de la serie
        title:
          type: string
          description: Título de la serie
        status:
          type: string
          description: Estado actual de la serie (ej. 'En progreso', 'Completada', 'Abandonada')
        last_episode_watched:
          type: integer
          description: Último episodio visto
        total_episodes:
          type: integer
          description: Número total de episodios
        ranking:
          type: integer
          description: Puntuación o clasificación de la serie
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Fecha y hora de creación del registro
      required:
        - title
        - status
        - last_episode_watched
        - total_episodes
        - ranking
      example:
        id: 1
        title: "Breaking Bad"
        status: "Completada"
        last_episode_watched: 62
        total_episodes: 62
        ranking: 10
        created_at: "2023-01-01T12:00:00Z"

    SeriesForm:
      type: object
      properties:
        title:
          type: string
          description: Título de la serie
        status:
          type: string
          description: Estado actual de la serie
        lastEpisodeWatched:
          type: integer
          description: Último episodio visto
        totalEpisodes:
          type: integer
          description: Número total de episodios
        ranking:
          type: integer
          description: Puntuación o clasificación de la serie
      required:
        - title
        - status
        - lastEpisodeWatched
        - totalEpisodes
        - ranking
      example:
        title: "Breaking Bad"
        status: "Completada"
        lastEpisodeWatched: 62
        totalEpisodes: 62
        ranking: 10

    StatusUpdate:
      type: object
      properties:
        status:
          type: string
          description: Nuevo estado de la serie
      required:
        - status
      example:
        status: "Completada"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Mensaje de error
      example:
        error: "Serie no encontrada"

    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          description: Mensaje de éxito
      example:
        message: "Serie eliminada correctamente"

paths:
  /series:
    get:
      summary: Obtener todas las series
      operationId: getAllSeries
      tags:
        - Series
      responses:
        '200':
          description: Lista de series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Series'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      summary: Crear una nueva serie
      operationId: createSeries
      tags:
        - Series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesForm'
      responses:
        '201':
          description: Serie creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /series/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID de la serie
    
    get:
      summary: Obtener una serie por ID
      operationId: getSeriesById
      tags:
        - Series
      responses:
        '200':
          description: Serie encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '404':
          description: Serie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      summary: Actualiza una serie existente
      operationId: updateSeries
      tags:
        - Series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesForm'
      responses:
        '200':
          description: Serie actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Serie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      summary: Elimina una serie
      operationId: deleteSeries
      tags:
        - Series
      responses:
        '200':
          description: Serie eliminada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: Serie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /series/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID de la serie
    
    patch:
      summary: Actualiza el estado de una serie
      operationId: updateStatus
      tags:
        - Series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
      responses:
        '200':
          description: Estado actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Serie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /series/{id}/episode:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID de la serie
    
    patch:
      summary: Incrementa el contador de episodios vistos
      operationId: incrementEpisode
      tags:
        - Series
      responses:
        '200':
          description: Episodio incrementado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          description: No se puede incrementar más allá del total de episodios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Serie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /series/{id}/upvote:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID de la serie
    
    patch:
      summary: Incrementa la puntuación de una serie
      operationId: upvoteSeries
      tags:
        - Series
      responses:
        '200':
          description: Puntuación incrementada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '404':
          description: Serie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /series/{id}/downvote:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID de la serie
    
    patch:
      summary: Reduce la puntuación de una serie
      operationId: downvoteSeries
      tags:
        - Series
      responses:
        '200':
          description: Puntuación reducida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '404':
          description: Serie no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
